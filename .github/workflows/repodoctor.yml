name: RepoDoctor Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  repodoctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build RepoDoctor
        run: go build .

      - name: Run unit and integration tests
        run: go test ./...

      - name: Run static checks
        run: go vet ./...

      - name: Run v0.18 close-out gate pack
        shell: pwsh
        run: ./scripts/v018_closeout_gate.ps1

      - name: Run v0.19 benchmark budget gate
        shell: pwsh
        env:
          TZ: UTC
          LC_ALL: C
          GOMAXPROCS: 1
        run: ./scripts/v019_benchmark_gate.ps1

      - name: Run v0.19 release stabilization gate
        shell: pwsh
        env:
          TZ: UTC
          LC_ALL: C
          GOMAXPROCS: 1
        run: ./scripts/v019_release_stabilization_gate.ps1

      - name: Run v1.0 release stabilization gate
        shell: pwsh
        env:
          TZ: UTC
          LC_ALL: C
          GOMAXPROCS: 1
        run: ./scripts/v100_release_stabilization_gate.ps1

      - name: Run v1.1 release stabilization gate
        shell: pwsh
        env:
          TZ: UTC
          LC_ALL: C
          GOMAXPROCS: 1
        run: ./scripts/v110_release_stabilization_gate.ps1

      - name: Run RepoDoctor analysis
        run: go run . analyze -path . -format text

      - name: Run RepoDoctor analysis (JSON output)
        run: go run . analyze -path . -format json -verbose || true
        if: always()

      - name: Generate analysis artifact checksum
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "repodoctor-report.json") {
            $hash = (Get-FileHash "repodoctor-report.json" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "repodoctor-report.sha256" -Value $hash -NoNewline -Encoding ascii
          } else {
            Set-Content -Path "repodoctor-report.sha256" -Value "missing-report" -NoNewline -Encoding ascii
          }

      - name: Upload analysis results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repodoctor-report-${{ matrix.os }}
          path: |
            repodoctor-report.json
            repodoctor-report.sha256
            benchmark-gate.txt
          retention-days: 30
